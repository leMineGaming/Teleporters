name: Teleporters
version: '${project.version}'
main: org.leminegaming.teleporters.Teleporters
# api-version is a *minimum*: the server refuses to load a plugin whose
# api-version is newer than itself. Keep this at the oldest supported
# version (1.21) so one jar loads on 1.21.1 through 26.3.
api-version: '1.21'
authors: [ leMineGaming ]
description: Minecraft Plugin that creates teleporters
website: https://leminegaming.github.io/teleporters
commands:
  setupteleporter:
    description: Set up a teleport block on an emerald block.
    usage: /setupteleporter <private:true/false>
  teleport1:
    description: Set up teleport position 1.
    usage: /teleport1
  teleport2:
    description: Set up teleport position 2.
    usage: /teleport2
permissions:
  teleporters.create:
    description: Allows the player to create teleporters.
    default: false
  teleporters.use:
    description: Allows the player to use teleporters.
    default: false
  teleporters.bypass:
    description: Allows the player to use private teleporters they don’t own.
    default: op
  teleporters.bypasslimit:
    description: Allows the player to bypass the limit on teleporters.
    default: op